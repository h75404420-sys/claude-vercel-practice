<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Claude Code 배포 실습</title>
  <style>
    /* 화면 전체를 세로/가로 중앙 정렬 */
    body {
      height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: sans-serif;
      background-color: #f5f5f5;
    }

    /* 가운데 모여있는 글자들을 정렬 */
    .container {
      text-align: center;
    }

    h1 {
      font-size: 40px;
      color: #333;
    }

    p {
      font-size: 18px;
      color: #666;
    }

    .version {
      margin-top: 30px;
      font-size: 14px;
      color: #999;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Claude Code 배포 실습</h1>
    <p>첫 번째 배포에 성공했습니다.</p>
    <p class="version">Version 1</p>
  </div>
</body>
</html>
