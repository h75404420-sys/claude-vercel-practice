<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>그린스마트시티 프로젝트</title>
  <style>
    /* 화면 전체를 세로/가로 중앙 정렬 */
    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: sans-serif;
      background-color: #f5f5f5;
    }

    /* 가운데 모여있는 글자들을 정렬 */
    .container {
      text-align: center;
      padding: 40px 20px;
    }

    h1 {
      font-size: 40px;
      color: #333;
    }

    h2 {
      font-size: 24px;
      color: #333;
      margin-top: 0;
    }

    p {
      font-size: 18px;
      color: #666;
    }

    .version {
      margin-top: 30px;
      font-size: 14px;
      color: #999;
    }

    .flow {
      font-size: 16px;
      color: #888;
      margin-top: -10px;
    }

    .intro {
      max-width: 600px;
      margin: 40px auto 0;
      padding: 24px;
      background-color: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      text-align: left;
    }

    .intro p {
      font-size: 16px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>그린스마트시티 프로젝트</h1>
    <p class="flow">Claude Code → Git → GitHub → Vercel</p>
    <p>GitHub Push를 통한 자동 배포에 성공했습니다.</p>
    <p class="version">Version 2</p>

    <section class="intro">
      <h2>프로젝트 소개</h2>
      <p>
        그린스마트시티 프로젝트는 친환경 기술과 스마트 인프라를 결합하여
        지속 가능한 도시 환경을 구축하는 것을 목표로 합니다. 에너지 효율화,
        스마트 교통, 데이터 기반 도시 관리 시스템을 통해 시민의 삶의 질을
        높이고 탄소 배출을 줄이는 지속 가능한 도시 모델을 제시합니다.
      </p>
    </section>
  </div>
</body>
</html>
